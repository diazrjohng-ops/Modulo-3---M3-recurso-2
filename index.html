:root{--wine:#9C1C2E;--teal:#0D7377;--text:#444}

.zoom-hint{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--wine);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;opacity:0;transition:opacity .2s ease}

.modal-panel img{display:block;max-width:100%;max-height:86vh;width:auto;height:auto;margin:auto;border-radius:12px}
.close{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border:0;border-radius:50%;background:var(--wine);color:#fff;font-size:25px;cursor:pointer}

<div class="modal-panel"><button class="close" id="close" type="button" aria-label="Cerrar">×</button><img id="modalImg" alt=""></div>
</div>
<!-- =============== FIN MODAL AMPLIACIÓN =============== -->

<!-- =============== SCRIPT =============== -->
<script>
(()=>{const cards=[...document.querySelectorAll('.card')],modal=document.getElementById('modal'),img=document.getElementById('modalImg'),close=document.getElementById('close');
function openCard(c){const i=c.querySelector('img');img.src=i.src;img.alt=i.alt;modal.classList.add('open');modal.setAttribute('aria-hidden','false');close.focus()}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
cards.forEach(c=>{c.addEventListener('click',()=>openCard(c));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard(c)}})});
close.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal()})
})()
</script>
<!-- =============== FIN SCRIPT =============== -->
